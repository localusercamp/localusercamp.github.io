<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OG preview — 1200×630</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
    }

    body {
        position: relative;
        font-family: "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
        background: #111312;
        color: #ffffff;
    }

    .content {
        position: relative;
        z-index: 1;
        padding: 84px 88px;
    }

    .name {
        font-size: 96px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -2.5px;
    }

    .role {
        margin-top: 22px;
        font-size: 42px;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: #00ff84;
    }

    .glow {
        position: absolute;
        left: -10%;
        right: -10%;
        bottom: -320px;
        height: 560px;
        background: radial-gradient(50% 50% at 50% 50%, rgba(0, 255, 132, 0.9) 0%, rgba(0, 255, 132, 0.45) 40%, rgba(0, 255, 132, 0) 72%);
        filter: blur(24px);
    }

    .line {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 10px;
        background: linear-gradient(90deg, #00ff84 0%, rgba(0, 255, 132, 0.35) 55%, rgba(0, 255, 132, 0) 100%);
    }
</style>
</head>
<body>
    <div class="glow"></div>

    <div class="content">
        <div class="name">Евгений Полозов</div>
        <div class="role">Senior Fullstack Developer</div>
    </div>

    <div class="line"></div>
</body>
</html>
